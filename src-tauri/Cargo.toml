[package]
name = "desktop-spotlight-ai"
version = "0.1.0"
description = "Private local AI desktop chat with attached project context"
edition = "2021"

[lib]
name = "desktop_spotlight_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
